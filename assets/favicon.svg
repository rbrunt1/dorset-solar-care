<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="SolarMOT">
  <title>SolarMOT</title>
  <!--
    Favicon build of the SolarMOT icon — NOT a straight scale-down.
    Optimised for 16px, where the full logo's proportions stop working:
      - less padding, so the mark fills more of the tab's tiny canvas
      - proportionally thicker rays and a proportionally bolder, larger tick
      - rays shortened so nothing clips at the viewBox edge
    Verified by rendering at 16px and 32px rather than assumed.
  -->
  <defs>
    <linearGradient id="fvSun" x1="6" y1="5" x2="26" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC15E"/>
      <stop offset="0.55" stop-color="#F5A623"/>
      <stop offset="1" stop-color="#DE8A0E"/>
    </linearGradient>
    <mask id="fvTick">
      <rect x="0" y="0" width="32" height="32" fill="white"/>
      <path d="M11.0 16.4 L14.6 20.0 L21.2 12.6"
            fill="none" stroke="black" stroke-width="4.2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>

  <g stroke="url(#fvSun)" stroke-width="3.2" stroke-linecap="round">
    <line x1="16" y1="3.9" x2="16" y2="1.8"/>
    <line x1="16" y1="28.1" x2="16" y2="30.2"/>
    <line x1="3.9" y1="16" x2="1.8" y2="16"/>
    <line x1="28.1" y1="16" x2="30.2" y2="16"/>
    <line x1="7.5" y1="7.5" x2="5.9" y2="5.9"/>
    <line x1="24.5" y1="24.5" x2="26.1" y2="26.1"/>
    <line x1="7.5" y1="24.5" x2="5.9" y2="26.1"/>
    <line x1="24.5" y1="7.5" x2="26.1" y2="5.9"/>
  </g>

  <circle cx="16" cy="16" r="10.7" fill="url(#fvSun)" mask="url(#fvTick)"/>
</svg>
