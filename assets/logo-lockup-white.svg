<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 185 48" width="185" height="48" role="img" aria-label="SolarMOT">
  <title>SolarMOT</title>
  <!--
    Reversed lockup — white mark and wordmark, for use on dark backgrounds.

    This exists because logo-lockup-mono.svg uses currentColor, which does NOT
    inherit when an SVG is loaded via <img> (the image is an isolated document,
    so currentColor resolves to black and the logo disappears on dark). This
    file hard-codes white so it works as a plain image anywhere.

    The "MOT" keeps the amber accent, which has enough contrast on the brand's
    deep greens and near-blacks to stay legible while preserving the brand cue.
    For a strictly one-colour reversed version, delete the amber fill below.
  -->
  <defs>
    <mask id="lkwTick">
      <rect x="0" y="0" width="48" height="48" fill="white"/>
      <path d="M17.1 24.3 L22.0 29.2 L31.2 18.9"
            fill="none" stroke="black" stroke-width="5.1"
            stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>

  <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round">
    <line x1="24" y1="6.0" x2="24" y2="2.4"/>
    <line x1="24" y1="42.0" x2="24" y2="45.6"/>
    <line x1="6.0" y1="24" x2="2.4" y2="24"/>
    <line x1="42.0" y1="24" x2="45.6" y2="24"/>
    <line x1="11.55" y1="11.55" x2="8.9" y2="8.9"/>
    <line x1="36.45" y1="36.45" x2="39.1" y2="39.1"/>
    <line x1="11.55" y1="36.45" x2="8.9" y2="39.1"/>
    <line x1="36.45" y1="11.55" x2="39.1" y2="8.9"/>
  </g>
  <circle cx="24" cy="24" r="14.3" fill="#FFFFFF" mask="url(#lkwTick)"/>

  <text x="61" y="32.5"
        font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="27" font-weight="800" letter-spacing="-0.9">
    <tspan fill="#FFFFFF">Solar</tspan><tspan fill="#FFB94A">MOT</tspan>
  </text>
</svg>
