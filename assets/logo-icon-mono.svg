<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="SolarMOT">
  <title>SolarMOT</title>
  <!--
    Single-colour version of the SolarMOT icon.

    Identical geometry to logo-icon.svg but painted with currentColor, so it
    inherits whatever colour it's placed in. Use this for: one-colour print,
    embroidery, vinyl/van livery, faxed or photocopied paperwork, engraving,
    and anywhere the amber gradient can't reproduce.

    The tick remains negative space, so it works on any background.
  -->
  <defs>
    <mask id="smTickMono">
      <rect x="0" y="0" width="48" height="48" fill="white"/>
      <path d="M17.1 24.3 L22.0 29.2 L31.2 18.9"
            fill="none" stroke="black" stroke-width="5.1"
            stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>

  <g fill="currentColor" stroke="currentColor">
    <g stroke-width="4.5" stroke-linecap="round">
      <line x1="24" y1="6.0" x2="24" y2="2.4"/>
      <line x1="24" y1="42.0" x2="24" y2="45.6"/>
      <line x1="6.0" y1="24" x2="2.4" y2="24"/>
      <line x1="42.0" y1="24" x2="45.6" y2="24"/>
      <line x1="11.55" y1="11.55" x2="8.9" y2="8.9"/>
      <line x1="36.45" y1="36.45" x2="39.1" y2="39.1"/>
      <line x1="11.55" y1="36.45" x2="8.9" y2="39.1"/>
      <line x1="36.45" y1="11.55" x2="39.1" y2="8.9"/>
    </g>
    <circle cx="24" cy="24" r="14.3" stroke="none" mask="url(#smTickMono)"/>
  </g>
</svg>
