<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 185 48" width="185" height="48" role="img" aria-label="SolarMOT">
  <title>SolarMOT</title>
  <!--
    Single-colour horizontal lockup, painted with currentColor.

    IMPORTANT — how currentColor actually behaves here:
    It only inherits when this SVG is INLINED into the page (paste the markup)
    or opened in a vector editor. An SVG loaded via <img src="..."> is an
    isolated document and cannot see the parent page's colour, so currentColor
    falls back to black. Don't expect `color: white` on a wrapper to reverse it.

    Use this file for: one-colour print, van livery, embroidery, stamps,
    engraving, faxed/photocopied paperwork — cases where someone opens it and
    sets the ink colour themselves.

    To reverse the logo out of a dark background as a normal image, use
    logo-lockup-white.svg instead.
  -->
  <defs>
    <mask id="lkmTick">
      <rect x="0" y="0" width="48" height="48" fill="white"/>
      <path d="M17.1 24.3 L22.0 29.2 L31.2 18.9"
            fill="none" stroke="black" stroke-width="5.1"
            stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>

  <g fill="currentColor" stroke="currentColor">
    <g stroke-width="4.5" stroke-linecap="round">
      <line x1="24" y1="6.0" x2="24" y2="2.4"/>
      <line x1="24" y1="42.0" x2="24" y2="45.6"/>
      <line x1="6.0" y1="24" x2="2.4" y2="24"/>
      <line x1="42.0" y1="24" x2="45.6" y2="24"/>
      <line x1="11.55" y1="11.55" x2="8.9" y2="8.9"/>
      <line x1="36.45" y1="36.45" x2="39.1" y2="39.1"/>
      <line x1="11.55" y1="36.45" x2="8.9" y2="39.1"/>
      <line x1="36.45" y1="11.55" x2="39.1" y2="8.9"/>
    </g>
    <circle cx="24" cy="24" r="14.3" stroke="none" mask="url(#lkmTick)"/>
    <text x="61" y="32.5" stroke="none"
          font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="27" font-weight="800" letter-spacing="-0.9">SolarMOT</text>
  </g>
</svg>
