<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="SolarMOT">
  <title>SolarMOT</title>
  <!--
    SolarMOT icon — a sun whose disc carries a knocked-out checkmark.

    Design notes:
    - The tick is NEGATIVE SPACE (via mask), not a drawn-on shape. That means it
      shows whatever is behind the logo, so the same single file reads correctly
      on white, on the deep-green footer, and on a browser tab in light or dark
      mode. No light/dark variants to maintain.
    - Solid disc plus few, chunky rays: mass survives being scaled to 16px.
      The previous mark used 1.9px hairline strokes, which turn to mush at
      favicon size.
    - 8 rays at 45 degrees, geometrically constructed, so it reads as a sun
      instantly rather than needing to be deciphered.
    - Amber reads as "solar" and has adequate contrast against both white and
      near-black, which is why the mark needs no background tile.
  -->
  <defs>
    <linearGradient id="smSun" x1="10" y1="8" x2="38" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC15E"/>
      <stop offset="0.55" stop-color="#F5A623"/>
      <stop offset="1" stop-color="#DE8A0E"/>
    </linearGradient>

    <!-- White = keep, black = knock out. The tick is knocked out of the disc. -->
    <mask id="smTick">
      <rect x="0" y="0" width="48" height="48" fill="white"/>
      <path d="M17.1 24.3 L22.0 29.2 L31.2 18.9"
            fill="none" stroke="black" stroke-width="5.1"
            stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>

  <!-- Rays -->
  <g stroke="url(#smSun)" stroke-width="4.5" stroke-linecap="round">
    <line x1="24" y1="6.0" x2="24" y2="2.4"/>
    <line x1="24" y1="42.0" x2="24" y2="45.6"/>
    <line x1="6.0" y1="24" x2="2.4" y2="24"/>
    <line x1="42.0" y1="24" x2="45.6" y2="24"/>
    <line x1="11.55" y1="11.55" x2="8.9" y2="8.9"/>
    <line x1="36.45" y1="36.45" x2="39.1" y2="39.1"/>
    <line x1="11.55" y1="36.45" x2="8.9" y2="39.1"/>
    <line x1="36.45" y1="11.55" x2="39.1" y2="8.9"/>
  </g>

  <!-- Disc with the checkmark knocked out of it -->
  <circle cx="24" cy="24" r="14.3" fill="url(#smSun)" mask="url(#smTick)"/>
</svg>
